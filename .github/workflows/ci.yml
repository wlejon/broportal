name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# broportal resolves its siblings from ../<name> (brodbus, the shared sd-bus
# layer, on Linux; bronze for the broportal_api JavaScript binding, on in a
# top-level build), so every job reconstructs that layout in the runner
# workspace before configuring:
#
#     $GITHUB_WORKSPACE/
#       broportal/  <- this repo, checked out into a named path, not the root
#       brodbus/
#       bronze/     <- the JavaScript runtime broportal_api binds
#       brass/      <- bronze's code generator
#
# bronze and brass are laid out by bronze's checkout-toolchain action and
# compiled inside this build tree with the job's own compiler and CRT; the api
# is bound across bronze's C++ embed boundary, so a prebuilt bronze would be an
# unverifiable ABI hazard. brodbus is taken from main, as the stack is
# developed; the submodule job builds the pinned third_party/brodbus instead.
#
# Linux jobs run every test on its own private dbus-daemon, with the backend
# answering a separate sd-bus connection, gdbus and dbus-send, and, in
# test_xdp_frontend, the distribution's real xdg-desktop-portal frontend in
# front of it. Nothing touches the runner's session bus.
#
# Windows and macOS build the portable part (the value types and
# broportal::available()) and run test_types plus test_unavailable, which
# holds the library to saying why it cannot serve portals there.
env:
  LINUX_PACKAGES: >-
    ninja-build pkg-config libsystemd-dev dbus-daemon dbus-bin libglib2.0-bin xdg-desktop-portal

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, cc: gcc,   cxx: g++,     config: Release }
          - { name: linux-clang,        os: ubuntu-24.04, cc: clang, cxx: clang++, config: Release }
          - { name: windows-msvc,       os: windows-2022,                          config: Release }
          # Debug CRT: iterator debugging.
          - { name: windows-msvc-debug, os: windows-2022,                          config: Debug }
          - { name: macos-arm64,        os: macos-15,                              config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: broportal

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brodbus
          path: brodbus

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S broportal -B build
          else
            cmake -S broportal -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        shell: bash
        run: broportal/.github/ci/ctest.sh --test-dir build -C ${{ matrix.config }}

  # ── Submodule fallback ────────────────────────────────────────────────────
  #
  # No brodbus checkout: it comes from the flat third_party/ submodule at the
  # commit this repo pins, as it does for a fresh `git clone --recursive`.
  # bronze and brass are the documented exception (the api has to compile
  # against the bronze of the program that loads it, so there is no submodule
  # for either) and are laid out beside the repo as in every other job. The
  # configure step checks brodbus really took the submodule path.
  submodule:
    name: Submodule fallback · ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: broportal
          submodules: recursive

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends $LINUX_PACKAGES

      - name: Configure
        shell: bash
        run: |
          test ! -e brodbus
          cmake -S broportal -B build -G Ninja -DCMAKE_BUILD_TYPE=Release | tee configure.log
          grep -q "broportal: brodbus from .*third_party/brodbus" configure.log

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: broportal/.github/ci/ctest.sh --test-dir build

  # ── Coverage ──────────────────────────────────────────────────────────────
  #
  # Linux only (the backend exists only there), Debug (-O0).
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: broportal

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brodbus
          path: brodbus

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcovr $LINUX_PACKAGES

      - name: Configure (instrumented)
        run: |
          cmake -S broportal -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBROPORTAL_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: broportal/.github/ci/ctest.sh --test-dir build

      # pipefail: piping gcovr into tee otherwise hands the step tee's exit
      # status, so a gcovr crash produces no report and the job still goes green.
      - name: Report
        shell: bash
        run: |
          set -o pipefail
          mkdir -p coverage-html
          gcovr --root . \
            --filter 'broportal/src/' --filter 'broportal/include/broportal/' \
            --exclude-unreachable-branches \
            --print-summary \
            --html-details coverage-html/index.html \
            | tee coverage-summary.txt
          test -s coverage-html/index.html

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Coverage — `src/` + `include/broportal/`'
            echo
            echo 'Linux, private dbus-daemon buses, gdbus and the distribution xdg-desktop-portal as clients.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 14
