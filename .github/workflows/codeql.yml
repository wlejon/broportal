name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Everything broportal reads comes from other processes on the session bus:
# method arguments from xdg-desktop-portal (on behalf of any application),
# nested variants and file descriptors it unmarshals, and URIs it encodes. The
# message readers and the per-portal argument parsing are where the realistic
# bugs are.
#
# Two analyses: Linux (everything) and Windows (the portable value types).
#
# The siblings CMake compiles into the build (brodbus on Linux; bronze and
# brass for broportal_api, on in a top-level build) are built ahead of `init`,
# so they are never traced: for a compiled language CodeQL extracts only what
# it watches being compiled, and each sibling is analysed in its own
# repository. Everything broportal owns is built after `init`.
jobs:
  analyze:
    name: Analyze C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v7
        with:
          path: broportal

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brodbus
          path: brodbus

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libsystemd-dev

      - name: Configure and pre-build siblings (outside the traced build)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S broportal -B build -DBROPORTAL_BUILD_TESTS=OFF
            cmake --build build --config Debug --parallel 4 --target bronze_runtime_shared
          else
            cmake -S broportal -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBROPORTAL_BUILD_TESTS=OFF
            cmake --build build --parallel 4 --target bronze_runtime_shared brodbus
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          source-root: broportal
          queries: security-extended

      - name: Build (traced)
        run: cmake --build build --config Debug --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp/os:${{ runner.os }}
